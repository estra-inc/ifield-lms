name: Secret Scan

# public リポジトリのため、キーやトークンが混入したら PR の時点で落とす。
# 誤検知は .gitleaksignore に fingerprint を追記して除外する
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks git . --log-opts="--all" --redact --verbose --exit-code 1
